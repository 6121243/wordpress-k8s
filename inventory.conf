# =============================================================
# Inventaire du cluster — à adapter à VOTRE environnement
# (aucun secret ici : ce fichier peut être versionné)
# =============================================================

# Adresse IP du master (plan de contrôle + serveur NFS)
MASTER_IP=10.30.20.10

# Workers : adresses IP ou noms d'hôtes, séparés par des espaces
# (ajoutez le 3e worker si vous en avez un)
WORKERS="10.30.20.21 10.30.20.22"

# Utilisateur SSH présent sur tous les workers
SSH_USER=test

# Stockage persistant : serveur NFS (ici le master) et dossier exporté
NFS_SERVER=10.30.20.10
NFS_PATH=/srv/nfs/wordpress
# Réseau autorisé à monter l'export NFS (sous-réseau du cluster)
NFS_ALLOWED_NET=10.30.20.0/24

# Nom du site (à mettre dans /etc/hosts du poste extérieur)
SITE_NAME=wordpress.local

# Port d'exposition (doit correspondre à k8s/base/wordpress-service.yaml)
NODE_PORT=30080
