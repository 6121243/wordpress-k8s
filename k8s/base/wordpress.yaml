# Application WordPress. Les fichiers envoyés (images, thèmes, extensions)
# sont dans wp-content, monté sur une PVC partagée (NFS, ReadWriteMany).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels:
    app: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          image: wordpress:6.5-apache
          ports:
            - containerPort: 80
              name: http
          env:
            - name: WORDPRESS_DB_HOST
              value: mysql:3306
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef: {name: wordpress-db, key: MYSQL_DATABASE}
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef: {name: wordpress-db, key: MYSQL_USER}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: wordpress-db, key: MYSQL_PASSWORD}
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wp-content
---
# Exposition externe : NodePort 30080 sur chaque nœud du cluster.
# http://<IP_d_un_noeud>:30080  (ou http://wordpress.local:30080 via /etc/hosts)
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  labels:
    app: wordpress
spec:
  type: NodePort
  selector:
    app: wordpress
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
